galeri:[['HUT20Paroki20ke2064','Perayaan HUT Paroki ke-64'],['Perayaan20Minggu20Palma202025','Perayaan Minggu Palma'],['Pembacaan20kisah20sengsara20Kristus20Minggu20Palma','Pembacaan Kisah Sengsara Kristus'],['Visuailisasi20Kisah20Sengsara20Kristus','Visualisasi Kisah Sengsara Kristus'],['Visualisasi20kisah20sengsara20Kristus','Visualisasi Kisah Sengsara Kristus'],['kisah20sengsara20Yesus','Kisah Sengsara Yesus']].map(a=>({img:F+a[0]+'.jpg',cap:a[1]})),

const SC=[
{k:'umum',t:'Umum & kontak',f:[['nama','Nama lengkap paroki'],['singkat','Nama singkat'],['sub','Keuskupan / kevikepan'],['alamat','Alamat','ta'],['telp','Nomor telepon'],['wa','WhatsApp (awali 62, tanpa + dan spasi)'],['email','Email'],['jam','Jam kantor'],['ticker','Pengumuman berjalan (kosongkan untuk menyembunyikan)'],['logo','Logo','img'],['ig','Link Instagram'],['fb','Link Facebook'],['tt','Link TikTok'],['yt','Link YouTube']]},
{k:'beranda',t:'Beranda & profil',f:[['judul','Judul utama'],['slogan','Kalimat pembuka'],['hero','Foto utama','img'],['tentang','Tentang paroki','ta'],['donasiTeks','Teks ajakan persembahan','ta']]},
{k:'stat',t:'Angka profil',l:1,f:[['n','Angka / isi'],['l','Keterangan']]},
{k:'jadwal',t:'Jadwal misa',l:1,f:[['hari','Hari'],['jam','Jam'],['ket','Keterangan']]},
{k:'layanan',t:'Pusat layanan',l:1,f:[['t','Nama layanan'],['d','Rangkuman','ta']]},
{k:'renungan',t:'Renungan',l:1,m:1,f:[['judul','Judul'],['ayat','Ayat'],['kutipan','Kutipan ayat','ta'],['isi','Renungan','ta']]},
{k:'berita',t:'Berita',l:1,m:1,f:[['t','Judul'],['tgl','Tanggal','date'],['img','Foto (opsional)','img'],['isi','Isi berita','ta']]},
{k:'galeri',t:'Galeri',l:1,f:[['img','Foto','img'],['cap','Keterangan']]},
{k:'donasi',t:'Rekening persembahan',l:1,f:[['bank','Bank'],['no','Nomor rekening'],['an','Atas nama']]}];
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(x){return null}};
let D=JSON.parse(JSON.stringify(DEF)),L=ls('lang')||'id',tab='umum',base=null,RR=null;
const t=k=>T[L][k]||k;
function merge(o){for(const k in DEF)if(o&&o[k]!==undefined)D[k]=Array.isArray(DEF[k])?(Array.isArray(o[k])?o[k]:DEF[k]):{...DEF[k],...o[k]}}
function toast(m){const x=$('#toast');x.textContent=m;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),2200)}
function save(){try{localStorage.setItem('pc',JSON.stringify(D));toast('Tersimpan di browser ini')}catch(x){toast('Penyimpanan penuh: pakai foto lebih kecil')}}
const fd=d=>{try{return new Date(d).toLocaleDateString(L=='id'?'id-ID':'en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(x){return d}};
let ed=null;
function mview(sc){const k=sc.k,n=k=='berita',A=D[k],fl='style="display:flex;justify-content:space-between;align-items:center;gap:12px"';
if(ed!==null&&A[ed])return`<div class=pn><div ${fl}><h2>${n?'Edit berita':'Edit renungan'}</h2><button class=ad data-a=done>Selesai</button></div>${sc.f.map(f=>fld(k,ed,f)).join('')}<button class="sm dg" style="padding:8px 14px" data-a=del data-i=${ed}>Hapus ${n?'berita':'renungan'} ini</button></div>`;
return`<div class=pn><div ${fl}><h2>${sc.t} (${A.length})</h2><button class=ad data-a=add>+ ${n?'Berita':'Renungan'} baru</button></div>${n?'':'<p class=note>Setiap kali halaman dibuka, satu renungan dipilih acak dari daftar ini.</p>'}${A.map((it,i)=>`<div class=rw>${n&&it.img?`<img class=th src="${e(it.img)}" alt="">`:''}<div><b>${e(it.t||it.judul||'(tanpa judul)')}</b><small>${n?fd(it.tgl):e(it.ayat)}</small></div><button class=sm data-a=edit data-i=${i}>Edit</button><button class="sm dg" data-a=del data-i=${i}>Hapus</button></div>`).join('')||'<p>Belum ada data.</p>'}</div>`}

const val=(s,i,k)=>i===undefined||i===''?D[s][k]:D[s][i][k];
function fld(s,i,f){const[k,l,ty]=f,v=val(s,i,k)??'',at=`data-s="${s}" data-i="${i??''}" data-k="${k}"`;
if(ty=='ta')return`<label class=f>${l}<textarea ${at}>${e(v)}</textarea></label>`;
if(ty=='img')return`<label class=f>${l}<div class=ir><input ${at} value="${e(v)}" placeholder="alamat gambar atau unggah →">${v?`<img class=th src="${e(v)}" alt="">`:''}<button type=button data-up>Unggah</button></div></label>`;
return`<label class=f>${l}<input ${ty=='date'?'type=date':''} ${at} value="${e(v)}"></label>`}
function adm(){const a=$('#adm');
if(sessionStorage.getItem('ok')!='1'){a.innerHTML=`<div class=lgn><h2>Masuk admin</h2><label class=f>Kata sandi<input id=pw type=password autofocus></label><button class=ad id=go>Masuk</button></div>`;$('#pw').onkeydown=x=>{if(x.key=='Enter')$('#go').click()};return}
const sc=SC.find(x=>x.k==tab);let body='';
if(tab=='data')body=`<div class=pn><h2>Data & keamanan</h2><div class=note><b>Cara agar perubahan tampil ke semua pengunjung:</b> perubahan tersimpan di browser ini. Klik <i>Unduh content.json</i>, lalu unggah file itu ke folder yang sama dengan index.html di hosting (timpa file lama). Pengunjung akan membaca isi dari file tersebut.</div><p><button class=ad data-a=exp>Unduh content.json</button> <button class=sm data-a=imp>Impor content.json</button> <button class="sm dg" data-a=rst>Kembalikan isi awal</button></p><label class=f>Ganti kata sandi admin<input id=npw type=password placeholder="minimal 6 karakter"></label><button class=sm data-a=pw>Simpan kata sandi</button></div>`;
else if(sc.m)body=mview(sc);else body=`<div class=pn><h2>${sc.t}</h2>${sc.l?D[sc.k].map((it,i)=>`<div class=it><div><b>${e(it[sc.f[0][0]]||'Item '+(i+1))}</b><button class=sm data-a=up data-i=${i}>↑</button><button class=sm data-a=dn data-i=${i}>↓</button><button class="sm dg" data-a=del data-i=${i}>Hapus</button></div>${sc.f.map(f=>fld(sc.k,i,f)).join('')}</div>`).join('')+`<button class=ad data-a=add>+ Tambah</button>`:sc.f.map(f=>fld(sc.k,'',f)).join('')}</div>`;

$('#adm').addEventListener('input',x=>{const d=x.target.dataset;if(!d.k)return;const v=x.target.value;d.i===''?D[d.s][d.k]=v:D[d.s][d.i][d.k]=v;clearTimeout(save.t);save.t=setTimeout(save,500)});

if(d.up!==undefined){const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=()=>rs(fi.files[0],u=>{const inp=b.previousElementSibling||b.parentNode.querySelector('input');inp.value=u;inp.dispatchEvent(new Event('input',{bubbles:true}));adm()});fi.click();return}
const A=d.a,arr=sc&&D[sc.k];
if(A=='add'){const o={};sc.f.forEach(f=>o[f[0]]=f[2]=='date'?new Date().toISOString().slice(0,10):'');sc.k=='berita'?arr.unshift(o):arr.push(o);if(sc.m)ed=sc.k=='berita'?0:arr.length-1;save();adm()}
else if(A=='del'&&confirm('Hapus item ini?')){arr.splice(i,1);ed=null;save();adm()}
else if(A=='edit'){ed=i;adm();scrollTo(0,0)}else if(A=='done'){if(tab=='berita')D.berita.sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));ed=null;save();adm();scrollTo(0,0)}else if(A=='up'&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];save();adm()}
else if(A=='dn'&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];save();adm()}
else if(A=='out'){sessionStorage.removeItem('ok');adm()}

else if(A=='rst'&&confirm('Kembalikan semua isi ke awal?')){localStorage.removeItem('pc');D=JSON.parse(JSON.stringify(DEF));toast('Isi dikembalikan')}

function rs(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(f)}

try{const s=ls('pc');if(s)merge(JSON.parse(s))}catch(x){}
adm()})();
