<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F172A;--surface:#1E293B;--card:#273449;--border:#334155;
  --accent:#6366F1;--accent2:#818CF8;
  --success:#22C55E;--warn:#F59E0B;--danger:#EF4444;--info:#38BDF8;
  --text:#F1F5F9;--sub:#94A3B8;--muted:#475569;
  --radius:10px;--radius-lg:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}

/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* Sidebar */
#sidebar{width:220px;min-width:220px;background:var(--surface);display:flex;flex-direction:column;padding:0;border-right:1px solid var(--border)}
.sb-brand{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sb-brand .logo{font-size:28px;margin-bottom:4px}
.sb-brand h1{font-size:15px;font-weight:700;color:var(--text)}
.sb-brand p{font-size:11px;color:var(--sub);margin-top:2px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:all .15s;color:var(--sub);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;margin-bottom:2px}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);color:var(--accent2)}
.nav-btn .icon{font-size:16px;width:20px;text-align:center}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;flex-direction:column;height:100%;overflow:hidden}
.page.active{display:flex}

/* Page Header */
.page-hdr{padding:20px 28px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-hdr h2{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-warn{background:var(--warn);color:#1a1a1a}.btn-warn:hover{opacity:.85}
.btn-ghost{background:var(--card);color:var(--text)}.btn-ghost:hover{background:var(--border)}

/* Scroll area */
.scroll-area{flex:1;overflow-y:auto;padding:0 28px 24px}

/* Cards */
.card{background:var(--card);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;border:1px solid transparent;transition:border .15s}
.card:hover{border-color:var(--border)}

/* Task card */
.task-row{display:flex;align-items:flex-start;gap:10px}
.task-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;background:transparent}
.task-check.done{background:var(--success);border-color:var(--success)}
.task-check.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-name{font-size:14px;font-weight:600;margin-bottom:3px;transition:all .15s}
.task-name.done{text-decoration:line-through;color:var(--sub)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-red{background:#3d1a1a;color:#f87171}
.badge-yellow{background:#3d2e10;color:#fbbf24}
.badge-green{background:#1a3d1a;color:#4ade80}
.badge-blue{background:#1a2d3d;color:#60a5fa}
.badge-purple{background:#2a1a3d;color:#a78bfa}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;background:var(--border);color:var(--text)}
.icon-btn:hover{transform:scale(1.1)}
.icon-btn.edit:hover{background:var(--warn);color:#1a1a1a}
.icon-btn.del:hover{background:var(--danger);color:#fff}
.task-note{margin-top:6px;padding-left:30px;font-size:12px;color:var(--sub)}

/* Filter bar */
.filter-bar{padding:0 28px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0}
.filter-chip{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.filter-chip.active,.filter-chip:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* Stats row */
.stats-row{display:flex;gap:10px;padding:0 28px 14px;flex-shrink:0}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:12px 14px}
.stat-card .val{font-size:22px;font-weight:700}
.stat-card .lbl{font-size:11px;color:var(--sub);margin-top:2px}

/* Schedule */
.day-group{margin-bottom:16px}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-label{font-size:13px;font-weight:700}
.sched-card{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;border:1px solid transparent;transition:border .15s}
.sched-card:hover{border-color:var(--border)}
.sched-time-badge{background:var(--surface);border-radius:8px;padding:6px 10px;text-align:center;min-width:80px}
.sched-time-badge .time{font-size:12px;font-weight:700;color:var(--accent2)}
.sched-time-badge .day-sm{font-size:10px;color:var(--sub)}
.sched-info{flex:1}
.sched-name{font-weight:600;font-size:14px}
.sched-meta{font-size:12px;color:var(--sub);margin-top:2px}

/* Events */
.event-card{background:var(--card);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;border:1px solid transparent;transition:border .15s}
.event-card:hover{border-color:var(--border)}
.event-card.past{opacity:.55}
.date-badge{border-radius:var(--radius);padding:8px 12px;text-align:center;min-width:52px;flex-shrink:0}
.date-badge .day-n{font-size:20px;font-weight:800;line-height:1}
.date-badge .mon{font-size:11px;font-weight:600;margin-top:2px}
.event-info{flex:1;min-width:0}
.event-name{font-size:14px;font-weight:600;margin-bottom:4px}
.event-meta{font-size:12px;color:var(--sub);margin-bottom:3px}
.countdown{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;flex-shrink:0;align-self:center}
.cd-soon{background:#3d2e10;color:#fbbf24}
.cd-ok{background:#1a3d1a;color:#4ade80}
.cd-today{background:#3d1a1a;color:#f87171}
.cd-past{background:var(--muted);color:var(--sub)}

/* Notes */
#note-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  align-items: start;
}
.note-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 18px;
  border: 1px solid transparent;
  transition: transform .2s, border .2s, box-shadow .2s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  min-height: 140px;
}
.note-card:hover {
  border-color: var(--sub);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.note-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.note-preview { font-size: 13px; color: var(--sub); flex: 1; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; line-height: 1.5; margin-bottom: 12px; }
.note-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; margin-top: auto; }
.note-date { font-size: 11px; color: var(--muted); font-weight: 600; }
.color-picker { display: flex; gap: 10px; }
.color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .15s; }
.color-opt:hover { transform: scale(1.15); }
.color-opt.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--surface); }

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;color:var(--sub);text-align:center;grid-column: 1 / -1;}
.empty .em-icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;margin-bottom:4px}
.empty p{font-size:13px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter: blur(3px);}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;border:1px solid var(--border);padding:24px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:13px;padding:9px 12px;font-family:inherit;outline:none;transition:border .15s
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:70px}
.form-group select option{background:var(--card)}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Priority dot in cards */
.prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}

/* Progress bar */
.progress-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--info));transition:width .5s ease}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-brand">
    <div class="logo">📚</div>
    <h1>Student Manager</h1>
    <p>Atur hidup, raih impian</p>
  </div>
  <nav class="sb-nav">
    <button class="nav-btn active" onclick="showPage('tasks')" id="nav-tasks">
      <span class="icon">✅</span> Manajemen Tugas
    </button>
    <button class="nav-btn" onclick="showPage('schedule')" id="nav-schedule">
      <span class="icon">📅</span> Jadwal Kuliah
    </button>
    <button class="nav-btn" onclick="showPage('events')" id="nav-events">
      <span class="icon">🎯</span> Kegiatan Mendatang
    </button>
    <button class="nav-btn" onclick="showPage('notes')" id="nav-notes">
      <span class="icon">📝</span> Catatan
    </button>
  </nav>
  <div class="sb-footer" id="sb-date"></div>
</div>

<div id="main">

  <div class="page active" id="page-tasks">
    <div class="page-hdr">
      <h2>✅ Manajemen Tugas</h2>
      <button class="btn btn-primary" onclick="openTaskModal()">＋ Tambah Tugas</button>
    </div>
    <div class="stats-row" id="task-stats"></div>
    <div class="filter-bar">
      <span style="color:var(--sub);font-size:12px;font-weight:600">Filter:</span>
      <button class="filter-chip active" onclick="setFilter('all',this)">Semua</button>
      <button class="filter-chip" onclick="setFilter('active',this)">Aktif</button>
      <button class="filter-chip" onclick="setFilter('done',this)">Selesai</button>
    </div>
    <div class="scroll-area" id="task-list"></div>
  </div>

  <div class="page" id="page-schedule">
    <div class="page-hdr">
      <h2>📅 Jadwal Kuliah</h2>
      <button class="btn btn-primary" onclick="openSchedModal()">＋ Tambah Jadwal</button>
    </div>
    <div class="scroll-area" id="sched-list"></div>
  </div>

  <div class="page" id="page-events">
    <div class="page-hdr">
      <h2>🎯 Kegiatan Mendatang</h2>
      <button class="btn btn-primary" onclick="openEventModal()">＋ Tambah Kegiatan</button>
    </div>
    <div class="scroll-area" id="event-list"></div>
  </div>

  <div class="page" id="page-notes">
    <div class="page-hdr">
      <h2>📝 Catatan</h2>
      <button class="btn btn-primary" onclick="openNoteModal()">＋ Buat Catatan</button>
    </div>
    <div class="scroll-area" id="note-list"></div>
  </div>

</div>

<div class="overlay" id="task-overlay">
  <div class="modal">
    <h3 id="task-modal-title">Tambah Tugas</h3>
    <input type="hidden" id="task-edit-id">
    <div class="form-group">
      <label>Nama Tugas *</label>
      <input type="text" id="t-name" placeholder="Contoh: Laporan Praktikum Fisika">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mata Kuliah</label>
        <input type="text" id="t-course" placeholder="Contoh: Fisika Dasar">
      </div>
      <div class="form-group">
        <label>Deadline</label>
        <input type="date" id="t-due">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Prioritas</label>
        <select id="t-priority">
          <option value="high">🔴 Tinggi</option>
          <option value="medium" selected>🟡 Sedang</option>
          <option value="low">🟢 Rendah</option>
        </select>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="t-cat">
          <option>Tugas Kuliah</option>
          <option>Proyek</option>
          <option>Ujian</option>
          <option>Lain-lain</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Catatan</label>
      <textarea id="t-note" placeholder="Tambahkan catatan..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('task-overlay')">Batal</button>
      <button class="btn btn-primary" onclick="saveTask()">💾 Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="sched-overlay">
  <div class="modal">
    <h3 id="sched-modal-title">Tambah Jadwal Kuliah</h3>
    <input type="hidden" id="sched-edit-id">
    <div class="form-group">
      <label>Mata Kuliah *</label>
      <input type="text" id="s-name" placeholder="Contoh: Pemrograman Lanjut">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Hari</label>
        <select id="s-day">
          <option>Senin</option><option>Selasa</option><option>Rabu</option>
          <option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
        </select>
      </div>
      <div class="form-group">
        <label>Waktu</label>
        <input type="text" id="s-time" placeholder="08:00 - 10:00">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Ruang / Lokasi</label>
        <input type="text" id="s-room" placeholder="Contoh: Lab Komputer 2">
      </div>
      <div class="form-group">
        <label>Dosen</label>
        <input type="text" id="s-lecturer" placeholder="Nama dosen">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('sched-overlay')">Batal</button>
      <button class="btn btn-primary" onclick="saveSched()">💾 Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="event-overlay">
  <div class="modal">
    <h3 id="event-modal-title">Tambah Kegiatan</h3>
    <input type="hidden" id="event-edit-id">
    <div class="form-group">
      <label>Nama Kegiatan *</label>
      <input type="text" id="e-name" placeholder="Contoh: Seminar Nasional AI">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="e-date">
      </div>
      <div class="form-group">
        <label>Jam</label>
        <input type="text" id="e-time" placeholder="14:00">
      </div>
    </div>
    <div class="form-group">
      <label>Lokasi</label>
      <input type="text" id="e-loc" placeholder="Contoh: Aula Kampus A">
    </div>
    <div class="form-group">
      <label>Keterangan</label>
      <textarea id="e-desc" placeholder="Detail tambahan..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('event-overlay')">Batal</button>
      <button class="btn btn-primary" onclick="saveEvent()">💾 Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="note-overlay">
  <div class="modal">
    <h3 id="note-modal-title">Buat Catatan</h3>
    <input type="hidden" id="note-edit-id">
    <div class="form-group">
      <label>Judul Catatan</label>
      <input type="text" id="n-title" placeholder="Masukkan judul...">
    </div>
    <div class="form-group">
      <label>Isi Catatan</label>
      <textarea id="n-content" placeholder="Tulis catatan, ide, atau materi di sini..." style="min-height: 140px;"></textarea>
    </div>
    <div class="form-group">
      <label>Warna Tema</label>
      <div class="color-picker">
        <div class="color-opt selected" style="background:var(--card)" data-color="var(--card)" onclick="selectColor('var(--card)', this)"></div>
        <div class="color-opt" style="background:#3d1a1a" data-color="#3d1a1a" onclick="selectColor('#3d1a1a', this)"></div>
        <div class="color-opt" style="background:#3d2e10" data-color="#3d2e10" onclick="selectColor('#3d2e10', this)"></div>
        <div class="color-opt" style="background:#1a3d1a" data-color="#1a3d1a" onclick="selectColor('#1a3d1a', this)"></div>
        <div class="color-opt" style="background:#1a2d3d" data-color="#1a2d3d" onclick="selectColor('#1a2d3d', this)"></div>
        <div class="color-opt" style="background:#2a1a3d" data-color="#2a1a3d" onclick="selectColor('#2a1a3d', this)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('note-overlay')">Batal</button>
      <button class="btn btn-primary" onclick="saveNote()">💾 Simpan</button>
    </div>
  </div>
</div>

<script>
// ── Data Layer ────────────────────────────────────────────────
const DB_KEY = 'student_manager_v2';
let db = JSON.parse(localStorage.getItem(DB_KEY) || '{"tasks":[],"schedules":[],"events":[],"notes":[]}');
// Pastikan fitur notes tidak error untuk user lama
if (!db.notes) db.notes = [];

const save = () => localStorage.setItem(DB_KEY, JSON.stringify(db));
const uid  = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

// ── Navigation ────────────────────────────────────────────────
let currentPage = 'tasks';
let taskFilter  = 'all';

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  currentPage = name;
  render(name);
}

function setFilter(f, el) {
  taskFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ── Render ────────────────────────────────────────────────────
function render(name) {
  if (name === 'tasks')    renderTasks();
  if (name === 'schedule') renderSchedule();
  if (name === 'events')   renderEvents();
  if (name === 'notes')    renderNotes();
}

// TASKS
const PRIO_CFG = {
  high:   { label:'🔴 Tinggi',   cls:'badge-red',    dot:'#ef4444' },
  medium: { label:'🟡 Sedang',   cls:'badge-yellow', dot:'#f59e0b' },
  low:    { label:'🟢 Rendah',   cls:'badge-green',  dot:'#22c55e' }
};

function renderTasks() {
  const el = document.getElementById('task-list');
  const stats = document.getElementById('task-stats');
  const all   = db.tasks;
  const done  = all.filter(t => t.done).length;
  const over  = all.filter(t => !t.done && t.due && t.due < new Date().toISOString().slice(0,10)).length;
  const pct   = all.length ? Math.round((done/all.length)*100) : 0;

  stats.innerHTML = `
    <div class="stat-card"><div class="val" style="color:var(--text)">${all.length}</div><div class="lbl">Total Tugas</div></div>
    <div class="stat-card"><div class="val" style="color:var(--warn)">${all.length - done}</div><div class="lbl">Belum Selesai</div></div>
    <div class="stat-card"><div class="val" style="color:var(--success)">${done}</div><div class="lbl">Selesai</div></div>
    <div class="stat-card">
      <div class="val" style="color:var(--accent2)">${pct}%</div>
      <div class="lbl">Progress</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  let tasks = [...all];
  if (taskFilter === 'active') tasks = tasks.filter(t => !t.done);
  if (taskFilter === 'done')   tasks = tasks.filter(t => t.done);

  const order = { high: 0, medium: 1, low: 2 };
  tasks.sort((a, b) => a.done - b.done || (order[a.priority]||1) - (order[b.priority]||1));

  if (!tasks.length) {
    el.innerHTML = `<div class="empty"><div class="em-icon">📭</div><h3>Belum ada tugas</h3><p>Klik "+ Tambah Tugas" untuk mulai</p></div>`;
    return;
  }

  el.innerHTML = tasks.map(t => {
    const p = PRIO_CFG[t.priority] || PRIO_CFG.medium;
    const today = new Date().toISOString().slice(0,10);
    const overdue = !t.done && t.due && t.due < today;
    const dueLabel = t.due ? `📅 ${t.due}` : '';
    const overdueTag = overdue ? `<span class="badge badge-red">⚠ Terlambat</span>` : '';
    return `
      <div class="card">
        <div class="task-row">
          <div class="task-check ${t.done?'done':''}" onclick="toggleTask('${t.id}')" title="Tandai ${t.done?'belum':'sudah'} selesai"></div>
          <div class="prio-dot" style="background:${p.dot}"></div>
          <div class="task-body">
            <div class="task-name ${t.done?'done':''}">${esc(t.name)}</div>
            <div class="task-meta">
              ${t.course ? `<span>📖 ${esc(t.course)}</span>` : ''}
              ${dueLabel ? `<span>${dueLabel}</span>` : ''}
              <span class="badge ${p.cls}">${p.label}</span>
              ${t.cat ? `<span class="badge badge-purple">🏷 ${esc(t.cat)}</span>` : ''}
              ${overdueTag}
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn edit" onclick="openTaskModal('${t.id}')" title="Edit">✏</button>
            <button class="icon-btn del"  onclick="deleteTask('${t.id}')" title="Hapus">🗑</button>
          </div>
        </div>
        ${t.note ? `<div class="task-note">📝 ${esc(t.note)}</div>` : ''}
      </div>`;
  }).join('');
}

// SCHEDULE
const DAYS   = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const DAY_COLORS = ['#6366F1','#EC4899','#22C55E','#F59E0B','#06B6D4','#A78BFA','#EF4444'];

function renderSchedule() {
  const el = document.getElementById('sched-list');
  if (!db.schedules.length) {
    el.innerHTML = `<div class="empty"><div class="em-icon">📅</div><h3>Belum ada jadwal</h3><p>Tambahkan mata kuliah kamu!</p></div>`;
    return;
  }
  const grouped = {};
  DAYS.forEach(d => grouped[d] = []);
  db.schedules.forEach(s => { if (grouped[s.day]) grouped[s.day].push(s); });

  el.innerHTML = DAYS.map((day, i) => {
    const items = grouped[day];
    if (!items.length) return '';
    const color = DAY_COLORS[i];
    return `
      <div class="day-group">
        <div class="day-header">
          <div class="day-dot" style="background:${color}"></div>
          <span class="day-label" style="color:${color}">${day}</span>
          <span style="font-size:11px;color:var(--sub);margin-left:4px">${items.length} kelas</span>
        </div>
        ${items.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(s => `
          <div class="sched-card">
            <div class="sched-time-badge">
              <div class="time">${s.time || '—'}</div>
              <div class="day-sm">${day.slice(0,3)}</div>
            </div>
            <div class="sched-info">
              <div class="sched-name">${esc(s.name)}</div>
              <div class="sched-meta">
                ${s.room ? `📍 ${esc(s.room)}` : ''}
                ${s.room && s.lecturer ? ' · ' : ''}
                ${s.lecturer ? `👨‍🏫 ${esc(s.lecturer)}` : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="icon-btn edit" onclick="openSchedModal('${s.id}')" title="Edit">✏</button>
              <button class="icon-btn del"  onclick="deleteSched('${s.id}')" title="Hapus">🗑</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }).join('');
}

// EVENTS
function renderEvents() {
  const el = document.getElementById('event-list');
  if (!db.events.length) {
    el.innerHTML = `<div class="empty"><div class="em-icon">🎯</div><h3>Belum ada kegiatan</h3><p>Catat seminar, lomba, atau acara apapun!</p></div>`;
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const sorted = [...db.events].sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999'));

  el.innerHTML = sorted.map(ev => {
    const past = ev.date && ev.date < today;
    let diff = null, cdHtml = '';
    if (ev.date) {
      const d = Math.round((new Date(ev.date) - new Date()) / 86400000);
      diff = d;
      if (d < 0)      cdHtml = `<span class="countdown cd-past">Sudah lewat</span>`;
      else if (d === 0) cdHtml = `<span class="countdown cd-today">Hari ini!</span>`;
      else if (d <= 7)  cdHtml = `<span class="countdown cd-soon">${d} hari lagi</span>`;
      else              cdHtml = `<span class="countdown cd-ok">${d} hari lagi</span>`;
    }
    let dayN = '?', mon = '';
    if (ev.date) {
      const d = new Date(ev.date + 'T00:00:00');
      dayN = d.getDate();
      mon  = d.toLocaleString('id-ID', { month: 'short' });
    }
    const badgeBg = past ? 'var(--muted)' : 'var(--accent)';
    return `
      <div class="event-card ${past?'past':''}">
        <div class="date-badge" style="background:${badgeBg}">
          <div class="day-n" style="color:#fff">${dayN}</div>
          <div class="mon" style="color:rgba(255,255,255,.8)">${mon}</div>
        </div>
        <div class="event-info">
          <div class="event-name">${esc(ev.name)}</div>
          <div class="event-meta">
            ${ev.time ? `🕐 ${ev.time}` : ''}
            ${ev.time && ev.location ? ' · ' : ''}
            ${ev.location ? `📍 ${esc(ev.location)}` : ''}
          </div>
          ${ev.desc ? `<div class="event-meta">💬 ${esc(ev.desc)}</div>` : ''}
        </div>
        ${cdHtml}
        <div class="task-actions">
          <button class="icon-btn edit" onclick="openEventModal('${ev.id}')" title="Edit">✏</button>
          <button class="icon-btn del"  onclick="deleteEvent('${ev.id}')" title="Hapus">🗑</button>
        </div>
      </div>`;
  }).join('');
}

// NOTES
function renderNotes() {
  const el = document.getElementById('note-list');
  if (!db.notes || !db.notes.length) {
    el.innerHTML = `<div class="empty"><div class="em-icon">📝</div><h3>Belum ada catatan</h3><p>Mulai tulis ide atau materi kuliahmu!</p></div>`;
    return;
  }
  
  // Sort by newest updated
  const sorted = [...db.notes].sort((a,b) => b.updatedAt - a.updatedAt);
  
  el.innerHTML = sorted.map(n => {
    const dateStr = new Date(n.updatedAt).toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
    return `
      <div class="note-card" style="background: ${n.color || 'var(--card)'}" onclick="openNoteModal('${n.id}')">
        <div class="note-title">${esc(n.title) || 'Tanpa Judul'}</div>
        <div class="note-preview">${esc(n.content)}</div>
        <div class="note-footer">
          <div class="note-date">${dateStr}</div>
          <div class="task-actions" onclick="event.stopPropagation()">
            <button class="icon-btn del" onclick="deleteNote('${n.id}')" title="Hapus">🗑</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── CRUD Helpers ──────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function g(id) { return document.getElementById(id) }
function gv(id) { return g(id).value.trim() }
function sv(id,v) { g(id).value = v || '' }

// Modal helpers
function openModal(id) { g(id).classList.add('open') }
function closeModal(id) { g(id).classList.remove('open') }

// Close on overlay click
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open') });
});

// TASK MODAL
function openTaskModal(id) {
  const task = id ? db.tasks.find(t => t.id === id) : null;
  g('task-modal-title').textContent = task ? 'Edit Tugas' : 'Tambah Tugas';
  sv('task-edit-id', task ? task.id : '');
  sv('t-name',     task?.name);
  sv('t-course',   task?.course);
  sv('t-due',      task?.due);
  sv('t-priority', task?.priority || 'medium');
  sv('t-cat',      task?.cat || 'Tugas Kuliah');
  sv('t-note',     task?.note);
  openModal('task-overlay');
  setTimeout(() => g('t-name').focus(), 100);
}
function saveTask() {
  const name = gv('t-name');
  if (!name) { alert('Nama tugas tidak boleh kosong!'); return; }
  const editId = gv('task-edit-id');
  const task = {
    id:       editId || uid(),
    name,
    course:   gv('t-course'),
    due:      gv('t-due'),
    priority: gv('t-priority'),
    cat:      gv('t-cat'),
    note:     gv('t-note'),
    done:     editId ? (db.tasks.find(t=>t.id===editId)?.done || false) : false
  };
  if (editId) {
    const idx = db.tasks.findIndex(t => t.id === editId);
    db.tasks[idx] = task;
  } else {
    db.tasks.push(task);
  }
  save(); closeModal('task-overlay'); renderTasks();
}
function toggleTask(id) {
  const t = db.tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); renderTasks(); }
}
function deleteTask(id) {
  if (!confirm('Yakin hapus tugas ini?')) return;
  db.tasks = db.tasks.filter(t => t.id !== id);
  save(); renderTasks();
}

// NOTE MODAL
let selectedNoteColor = 'var(--card)';
function selectColor(color, el) {
  selectedNoteColor = color;
  document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('selected'));
  if (el) el.classList.add('selected');
}

function openNoteModal(id) {
  const n = id ? db.notes.find(x => x.id === id) : null;
  g('note-modal-title').textContent = n ? 'Edit Catatan' : 'Buat Catatan';
  sv('note-edit-id', n ? n.id : '');
  sv('n-title', n?.title);
  sv('n-content', n?.content);
  
  // Setup color picker
  selectedNoteColor = n?.color || 'var(--card)';
  document.querySelectorAll('.color-opt').forEach(c => {
    if (c.dataset.color === selectedNoteColor) {
      c.classList.add('selected');
    } else {
      c.classList.remove('selected');
    }
  });

  openModal('note-overlay');
  setTimeout(() => g('n-title').focus(), 100);
}
function saveNote() {
  const title = gv('n-title');
  const content = gv('n-content');
  if (!title && !content) { alert('Isi catatan atau judul tidak boleh kosong!'); return; }
  
  const editId = gv('note-edit-id');
  const note = { 
    id: editId || uid(), 
    title, 
    content, 
    color: selectedNoteColor,
    updatedAt: Date.now() 
  };
  
  if (editId) {
    const idx = db.notes.findIndex(x => x.id === editId);
    db.notes[idx] = note;
  } else {
    db.notes.push(note);
  }
  save(); closeModal('note-overlay'); renderNotes();
}
function deleteNote(id) {
  if (!confirm('Yakin mau menghapus catatan ini?')) return;
  db.notes = db.notes.filter(n => n.id !== id);
  save(); renderNotes();
}

// ── Init ─────────────────────────────────────────────────────
const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const now = new Date();
g('sb-date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

renderTasks();
</script>
